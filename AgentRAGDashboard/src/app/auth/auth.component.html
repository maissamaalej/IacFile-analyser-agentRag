<div class="auth-container">


    <div class="auth-card">


        <h1>
            SignIn/SignUp
        </h1>



        <!-- Tabs -->

        <div class="tabs">


            <div 
            class="tab"
            [class.active]="activeTab==='login'"
            (click)="changeTab('login')">

                Sign In

            </div>



            <div 
            class="tab"
            [class.active]="activeTab==='signup'"
            (click)="changeTab('signup')">

                Sign Up

            </div>


        </div>





        <!-- LOGIN FORM -->

        <form 
        *ngIf="activeTab==='login'"
        [formGroup]="loginForm"
        (ngSubmit)="login()">



            <div class="input-box">

                <input 
                type="email"
                placeholder="Email *"
                formControlName="email">

                <i class="bi bi-envelope-fill"></i>

            </div>


            <!-- Email error -->

            <small class="error"
            *ngIf="
            loginForm.get('email')?.touched &&
            loginForm.get('email')?.invalid
            ">

                Email invalide

            </small>




            <div class="input-box">

                <input 
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Password *"
                formControlName="password">
                <i 
                class="bi"
                [ngClass]="showPassword ? 'bi-eye-fill' : 'bi-lock-fill'"
                (click)="togglePassword()">
                </i>

            </div>
            


            <!-- Password error -->

            <small class="error"
            *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
            ">

                Password minimum 6 caractères

            </small>





            <div class="remember">

                <input type="checkbox">

                <span>
                    Remember Me!
                </span>

            </div>



            <button type="submit">
                Sign In
            </button>



        </form>








        <!-- SIGNUP FORM -->


        <form 
        *ngIf="activeTab==='signup'"
        [formGroup]="signupForm"
        (ngSubmit)="signup()">



            <div class="input-box">

                <input 
                type="text"
                placeholder="First Name *"
                formControlName="firstName">

                <i class="bi bi-person-fill"></i>

            </div>


            <small class="error"
            *ngIf="
            signupForm.get('firstName')?.touched &&
            signupForm.get('firstName')?.invalid
            ">

                First Name obligatoire

            </small>





            <div class="input-box">

                <input 
                type="text"
                placeholder="Last Name *"
                formControlName="lastName">

                <i class="bi bi-person-fill"></i>

            </div>


            <small class="error"
            *ngIf="
            signupForm.get('lastName')?.touched &&
            signupForm.get('lastName')?.invalid
            ">

                Last Name obligatoire

            </small>





            <div class="input-box">

                <input 
                type="email"
                placeholder="Email *"
                formControlName="email">

                <i class="bi bi-envelope-fill"></i>

            </div>


            <small class="error"
            *ngIf="
            signupForm.get('email')?.touched &&
            signupForm.get('email')?.invalid
            ">

                Email invalide

            </small>





            <div class="input-box">

                <input 
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Password *"
                formControlName="password">


                <i 
                class="bi"
                [ngClass]="showPassword ? 'bi-eye-fill' : 'bi-lock-fill'"
                (click)="togglePassword()">
                </i>


            </div>



            <small class="error"
            *ngIf="
            signupForm.get('password')?.touched &&
            signupForm.get('password')?.invalid
            ">

                Password minimum 6 caractères

            </small>




            <button type="submit">
                S'inscrire
            </button>




        </form>


    </div>


</div>
