name: AgentRAG CI/CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/agentrag

jobs:

  # ==========================================
  # 1. BUILD SPRING BOOT
  # ==========================================

  build-backend:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests


  # ==========================================
  # 2. BUILD PYTHON AGENT RAG
  # ==========================================

  build-python:
    name: Build AgentRAG Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: src/main/java/org/example/agentrag/agentic-rag-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



  # ==========================================
  # 3. BUILD FRONTEND
  # ==========================================

  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AgentRAGDashboard/package-lock.json

      - name: Install dependencies
        working-directory: AgentRAGDashboard
        run: npm ci

      - name: Build Angular
        working-directory: AgentRAGDashboard
        run: npm run build

