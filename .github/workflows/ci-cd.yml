name: AgentRAG CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/agent-rag-backend:latest \
            .

      - name: Push Backend
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/agent-rag-backend:latest

      - name: Build AgentRAG Python
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/agent-rag-python:latest \
            ./src/main/java/org/example/agentrag/agentic-rag-python

      - name: Push AgentRAG Python
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/agent-rag-python:latest

      - name: Build Frontend
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/agent-rag-frontend:latest \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/agent-rag-frontend:latest